<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Sliding Puzzle Game</h1>
    <div class="options">
      <h3>Select Puzzle Size</h3>
      <button onclick="startGame(50)">50x50</button>
      <button onclick="startGame(100)">100x100</button>
      <button onclick="startGame(150)">150x150</button>
    </div>
    <div id="puzzle-container"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
